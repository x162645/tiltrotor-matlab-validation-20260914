name: Line B source-input wing and fuselage replay
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths:
      - '.github/workflows/line-b-source-airframe-replay.yml'
      - 'analysis/validation_whole_aircraft_trim/run_line_b_source_airframe_replay.m'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_source_airframe_replay(fullfile(pwd,'ci_artifacts','source_airframe'));
      - name: Snapshot code and check for unintended writes
        if: always()
        run: |
          mkdir -p ci_artifacts/source_airframe/code_snapshot
          cp -R model analysis/stage2_aircraft analysis/validation_whole_aircraft_trim ci_artifacts/source_airframe/code_snapshot/
          cp params_nominal.m ci_artifacts/source_airframe/code_snapshot/
          git rev-parse HEAD > ci_artifacts/source_airframe/COMMIT.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-airframe-${{ github.sha }}
          path: ci_artifacts/source_airframe
          if-no-files-found: error
