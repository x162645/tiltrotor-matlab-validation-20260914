name: Line B continuous correction V4
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/line-b-continuous-rotor-v4.yml','analysis/xv15_c81_corrigan_continuous_v4.m','analysis/validation_whole_aircraft_trim/run_line_b_v4_tests.m','analysis/validation_whole_aircraft_trim/run_line_b_v4_trim_case.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Preserve exact baseline rotor core for identity tests
        run: |
          mkdir -p ci_artifacts/v4_tests/baseline_core
          git fetch --depth=1 origin 9d0c2abce6a3367ec8c46ca7aeb534b45b8ed728
          git show 9d0c2abce6a3367ec8c46ca7aeb534b45b8ed728:analysis/stage2_aircraft/m1_evidence_v1_forward_rotor.m > ci_artifacts/v4_tests/baseline_core/ORIGINAL.txt
          python - <<'PY'
          import pathlib
          p=pathlib.Path('ci_artifacts/v4_tests/baseline_core')
          (p/'baseline_m1_rotor.m').write_text((p/'ORIGINAL.txt').read_text().replace('m1_evidence_v1_forward_rotor','baseline_m1_rotor'))
          PY
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_v4_tests(fullfile(pwd,'ci_artifacts','v4_tests'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-tests-${{ github.sha }}
          path: ci_artifacts/v4_tests
  trim:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        speed: [40,60,80,100]
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_v4_trim_case(${{ matrix.speed }},fullfile(pwd,'ci_artifacts','v4_trim'));
      - name: Preserve exact code and polar sources
        if: always()
        run: |
          mkdir -p ci_artifacts/v4_trim/code_snapshot
          cp -R model analysis/stage2_aircraft analysis/validation_whole_aircraft_trim ci_artifacts/v4_trim/code_snapshot/
          cp params_nominal.m analysis/xv15_c81*.m ci_artifacts/v4_trim/code_snapshot/
          git rev-parse HEAD > ci_artifacts/v4_trim/COMMIT.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-trim-${{ matrix.speed }}kt-${{ github.sha }}
          path: ci_artifacts/v4_trim
