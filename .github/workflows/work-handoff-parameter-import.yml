name: Preserve exact historical parameter audit for Work
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/work-handoff-parameter-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-fixed-file:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Restore fixed uploaded CSV and verify original hashes before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,base64,gzip,hashlib,os,pathlib,csv,io
          # Fixed transport only, NOT scientific corrections. Restore three
          # transport spelling errors and require BOTH original gzip/CSV hashes.
          # An unexpected byte aborts before any file is written.
          url='https://api.github.com/repos/x162645/tiltrotor-matlab/git/blobs/b4e5617daa7b9987906e979a795262d71aa35797'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'work-fixed-audit-import'})
          obj=json.load(urllib.request.urlopen(req,timeout=60))
          enc=''.join(obj['content'].split())
          for old,new in [('zRfi2hmoz','zRfi2moz'),('fQu5f3sQl','fQu5f5uQl'),('krPL6aUy4X','krPL6yy4X')]:
              assert enc.count(old)==1, 'Unexpected transport spelling'
              enc=enc.replace(old,new)
          enc=enc.rstrip('=');enc+='='*(-len(enc)%4)
          compressed=base64.b64decode(enc,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='06364b753a84f74f1e85d37b9e5686a83b337e7b2f36d3d6c80f3f3ea8105801', 'Transport mismatch; no write'
          raw=gzip.decompress(compressed)
          rawhash='4f3cc72898600c6f87caa8cd8f30254111e26343837b5a10ceb4ba75ba0ddd07'
          assert hashlib.sha256(raw).hexdigest()==rawhash, 'Original CSV mismatch'
          rows=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
          # File-search rendering adds an index column; it is not in raw CSV.
          assert len(rows)==73 and len(rows[0])==22
          assert {r['audit_commit'] for r in rows}=={'9d0c2abce6a3367ec8c46ca7aeb534b45b8ed728'}
          cols=['field_id','component','code_field','current_value','code_unit','printed_page','pdf_page_1based','identity_class','transform_or_assignment','limit_or_issue','source_evidence','implementation_status']
          text=io.StringIO(newline='');writer=csv.DictWriter(text,fieldnames=cols,lineterminator='\n');writer.writeheader()
          for row in rows:writer.writerow({k:row[k] for k in cols})
          extracted=text.getvalue().encode('utf-8')
          exhash='0ddd5f7785fa205c4f781e410c0be48135dbafdb515f0887ebd5d88327ab085c'
          assert hashlib.sha256(extracted).hexdigest()==exhash, 'Extract mismatch'
          root=pathlib.Path('docs/validation/line_b_implementation_20260910');dest=root/'handoff';dest.mkdir(exist_ok=True)
          (dest/'PARAMETER_IDENTITY_FIELDS_AUDITED.csv').write_bytes(raw)
          (dest/'HISTORICAL_PARAMETER_AUDIT_EXTRACT.csv').write_bytes(extracted)
          meta={'source_name':'PARAMETER_IDENTITY_FIELDS_AUDITED.csv','source_role':'USER_SAVED_STATIC_AUDIT_NOT_NEW_VALIDATION','audit_commit':'9d0c2abce6a3367ec8c46ca7aeb534b45b8ed728','original_bytes':len(raw),'original_rows':73,'original_columns':22,'sha256':rawhash,'extract_sha256':exhash,'import_only':True,'new_model_runs':0}
          (dest/'PARAMETER_IMPORT_MANIFEST.json').write_text(json.dumps(meta,indent=2)+'\n')
          readme=dest/'README.md';t=readme.read_text().replace('23列','22列').replace('原完整CSV保留在本次交接下载包。','完整原CSV同时永久存入本目录PARAMETER_IDENTITY_FIELDS_AUDITED.csv，字节哈希已经核验；交接下载包也保留副本。');readme.write_text(t)
          registry=root/'HANDOFF_SOURCE_REGISTRY.md';t=registry.read_text().replace('23列','22列').replace('原完整CSV随交接下载包保留。','原完整CSV同时永久存于handoff/PARAMETER_IDENTITY_FIELDS_AUDITED.csv，随交接下载包保留。');registry.write_text(t)
          print('EXACT_PARAMETER_AUDIT_PRESERVED',len(raw),len(rows),'rows; exact extract regenerated')
          PY
      - name: Commit source import only; refuse concurrent branch overwrite
        env:
          TASK_BRANCH: implementation/line-b-external-validation-20260910
        run: |
          remote_head=$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch advanced; refusing overwrite'; exit 1; }
          git diff --exit-code -- model analysis params_nominal.m
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/line_b_implementation_20260910/handoff docs/validation/line_b_implementation_20260910/HANDOFF_SOURCE_REGISTRY.md
          git diff --cached --quiet && exit 0
          git commit -m 'handoff: preserve original 73-field audit with hash-verified readable extract [skip ci]'
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
