name: Close D04 in the existing ledger without model reruns
on:
  push:
    branches: [research/dynamic-fidelity-benchmark-20260910]
    paths: ['.github/workflows/close-d04-ledger.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Verify already archived bytes and append one chronological entry
        run: |
          python tools/archive_d04_evidence.py --request docs/research/dynamic_fidelity/D04_ARCHIVE_REQUEST.json --verify-only
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/research/dynamic_fidelity/STEP_LEDGER.md');text=p.read_text()
          marker='## D04 来源耦合、状态保留和受限精确降阶（2026-09-11，已完成）'
          if marker not in text:
              text=text.replace('最新实施为文末D03；D01、D02及D02.1保留为历史。','最新实施为文末D04；D01、D02及D03保留为历史。')
              text=text.replace('下一D04尚未实施：','D03完成时提出的下一任务（轴向部分现见D04）：')
              entry='''

          ## D04 来源耦合、状态保留和受限精确降阶（2026-09-11，已完成）

          来源：NACA TN3044 PDF7–14/印刷6–13 Eq2–5/11–20；NASA TM88327 PDF11–13 Eq9、PDF28 Table1及Fig10/13/14。原PDF及所用页图像已核验；哈希、版本、参数角色和完整推导见D04_CONTRACT、D04_EXTERNAL_DATA_QUALIFICATION及D04_REPORT。源理论矩阵不是实测数据。

          方法：源均匀轴向小角叶素积分，动态锥度率进入气动阻尼及D03泵吸；质量矩阵联立桨叶/机体加速度；T_hub=T_aero-Nb*S*betaDDot。气动表观质量不加入机械质量。通用几何复用但此载荷不是原BEMT，D04不认领V7动态化。内部coupled/algebraic_coning/quasisteady共享载荷与工作点。

          实现与执行：08a69fa8f58a07f6b15d9fde572e4e0be48a1007，run34591743296/artifact10195939132。MATLAB R2021aUpdate8，132项通过、16数值轨迹。源独立矩阵相对差A<2.7e-11、B<9.2e-12；主通道内部NRMSE<.139%。新配平推力是重量约束，不作为预测精度评分。

          状态删减结果：同一通用双旋翼+.2deg共同输入，PP完整7状态峰值.469461m/s2；代数锥度3状态.323701，准定常1状态.219603。源参数单旋翼4→2时，PP最大相位差在.3–3/3–10/10–30rad/s分别约2.63/18.69/125.15deg。均为同模型谱系差异，不是飞行误差；CF与全部输出均保留。

          有限延伸：读取上述结果后提出共同运动精确约化，不伪称盲验或原创。4b21de8c0b50938629329cf4cb4fa38846d79df5，run34592335399/artifact10196153995：46检查、4数值轨迹。双旋翼相同初值/共同实际输入下7→4保留共同vi/beta/betaRate/w，频响相对差<5.8e-11、时域尺度化差<1.7e-14。非对称/差动输入不适用，不是第二构型验证；短计时不认领领先速度。

          外部资格：TN3044真实塔架数据已定位，尚缺Ib/S、实际Omega/theta载体及几何/零升力基准/strip修正对应。TM88327的无量纲重构、理论峰值与测量近似特征分开；不能将CH47证据当倾转验证。没有瞬态目标拟合或新的独立动态精度通过。

          原始证据：ec43e6faa0cdf5a0e4be704fcc5bdb982d821cb0，archive run34592769400，evidence_d04内88文件11,528,096字节。两原ZIP和每个保留成员的字节签名已实际校验并读取MAT/CSV/JSON；运行和检查数量不当成独立实验数量。

          重开条件：相应源版本、输入合同、叶素/力矩/质量耦合、动力学、工作点或降阶映射变化时作定向回归；报告改动不重跑模型。不要重新派D02/D03/旧27+24或本轮源矩阵/对称证明。下一步优先推进明确外部动态实例与倾转实际输入输出接口；扩展前飞/非对称/周期需要相应状态和证据。总主线仍为低成本动态可信与公平外部比较，不以测试数量/版本号替代原创方法。
          '''
              import textwrap
              text=text.rstrip()+'\n'+textwrap.dedent(entry).strip()+'\n'
              p.write_text(text)
          PY
      - name: Persist ledger only and preserve concurrent work
        env:
          TASK_BRANCH: research/dynamic-fidelity-benchmark-20260910
        run: |
          remote_head=$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch advanced; no overwrite'; exit 1; }
          git diff --exit-code -- model services analysis params_nominal.m
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/dynamic_fidelity/STEP_LEDGER.md
          git diff --cached --quiet && exit 0
          git commit -m 'research: close D04 in existing ledger with sources, methods, exact scope and preserved history [skip ci]'
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
