name: XV-15 helicopter trim validation V1 matrix diagnostic

on:
  push:
    branches:
      - diagnostic/whole-aircraft-trim-validation-20260907
    paths:
      - '.github/workflows/xv15-helicopter-trim-validation-v1-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xv15-helicopter-trim-v1-case:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_index: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2021a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a

      - name: Run one frozen XV-15 trim case from common seed
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;
            addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            refpath=fullfile(pwd,'analysis','validation_whole_aircraft_trim','reference_gtrs_helicopter_trim_kleinhesselink2007.csv');
            T=readtable(refpath);
            T=T(${{ matrix.case_index }},:);
            writetable(T,refpath);
            outdir=fullfile(pwd,'ci_artifacts',sprintf('case_%d',${{ matrix.case_index }}));
            run_xv15_helicopter_trim_validation_v1(outdir);

      - name: Upload case evidence
        uses: actions/upload-artifact@v4
        with:
          name: xv15-helicopter-trim-v1-case-${{ matrix.case_index }}
          path: ci_artifacts/case_${{ matrix.case_index }}
          if-no-files-found: error
