name: Line B fixed input reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-input:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_fixed_input_audit(fullfile(pwd,'ci_artifacts','fixed_input'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-input-${{ github.sha }}
          path: ci_artifacts/fixed_input
