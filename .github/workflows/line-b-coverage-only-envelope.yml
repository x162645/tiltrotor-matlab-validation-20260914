name: Line B coverage-only envelope
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/line-b-coverage-only-envelope.yml','analysis/validation_whole_aircraft_trim/run_line_b_coverage_only_envelope.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - name: Twenty direct wing calls; no new rotor or aircraft trim
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_coverage_only_envelope(fullfile(pwd,'ci_artifacts','coverage_only'));
      - name: Preserve exact implementation and unchanged production files
        if: always()
        run: |
          mkdir -p ci_artifacts/coverage_only/code_snapshot
          cp -R model analysis/stage2_aircraft analysis/validation_whole_aircraft_trim ci_artifacts/coverage_only/code_snapshot/
          cp params_nominal.m ci_artifacts/coverage_only/code_snapshot/
          git rev-parse HEAD > ci_artifacts/coverage_only/COMMIT.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-only-envelope-${{ github.sha }}
          path: ci_artifacts/coverage_only
          if-no-files-found: error
