name: Line B legacy velocity-only V2 reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        speed: [40,60,80,100]
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_tail_trim_case(${{ matrix.speed }},fullfile(pwd,'ci_artifacts','legacy_v2'),true,'VELOCITY_ONLY_V2');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-v2-${{ matrix.speed }}kt-${{ github.sha }}
          path: ci_artifacts/legacy_v2
