name: Line B coherent steady tail V3
# Historical diagnostic remains reproducible; shared functions no longer
# automatically trigger the obsolete four-point V3 trim search.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup; addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            outdir=fullfile(pwd,'ci_artifacts','coherent_tests');mkdir(outdir);
            run_line_b_fixed_input_audit(outdir); run_line_b_tail_replay(outdir);
            run_line_b_coherent_tail_tests(outdir);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coherent-tail-tests-${{ github.sha }}
          path: ci_artifacts/coherent_tests
  trim:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        speed: [40,60,80,100]
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup; addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_tail_trim_case(${{ matrix.speed }},fullfile(pwd,'ci_artifacts','coherent_trim'),true,'COHERENT_TAIL_V3');
      - name: Archive exact code snapshot
        if: always()
        run: |
          mkdir -p ci_artifacts/coherent_trim/code_snapshot
          cp -R model analysis/stage2_aircraft analysis/validation_whole_aircraft_trim ci_artifacts/coherent_trim/code_snapshot/
          cp params_nominal.m ci_artifacts/coherent_trim/code_snapshot/
          git rev-parse HEAD > ci_artifacts/coherent_trim/COMMIT.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coherent-tail-${{ matrix.speed }}kt-${{ github.sha }}
          path: ci_artifacts/coherent_trim
