name: Line B source spinner component V7
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/line-b-spinner-v7.yml','model/gtrs_spinner_steady.m','analysis/validation_whole_aircraft_trim/run_line_b_spinner_tests.m','analysis/validation_whole_aircraft_trim/run_line_b_v7_trim_case.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preserve exact pre-spinner force assembly
        run: |
          mkdir -p ci_artifacts/spinner_tests/baseline_sum
          git fetch --depth=1 origin 1c78982480be0545d2407d529e873707eb0980cb
          git show 1c78982480be0545d2407d529e873707eb0980cb:analysis/stage2_aircraft/stage2_total_forces_moments.m > ci_artifacts/spinner_tests/baseline_sum/ORIGINAL.txt
          python - <<'PY'
          import pathlib
          p=pathlib.Path('ci_artifacts/spinner_tests/baseline_sum')
          (p/'baseline_stage2_total_forces_moments.m').write_text((p/'ORIGINAL.txt').read_text().replace('stage2_total_forces_moments','baseline_stage2_total_forces_moments'))
          PY
          git diff 1c78982480be0545d2407d529e873707eb0980cb HEAD > ci_artifacts/spinner_tests/SPINNER_ONLY.patch
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_spinner_tests(fullfile(pwd,'ci_artifacts','spinner_tests'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinner-tests-${{ github.sha }}
          path: ci_artifacts/spinner_tests
  trim:
    needs: component-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        speed: [40,60,80,100]
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_v7_trim_case(${{ matrix.speed }},fullfile(pwd,'ci_artifacts','spinner_trim'));
      - name: Preserve exact physical configuration
        if: always()
        run: |
          mkdir -p ci_artifacts/spinner_trim/code_snapshot
          cp -R model analysis/stage2_aircraft analysis/validation_whole_aircraft_trim ci_artifacts/spinner_trim/code_snapshot/
          cp params_nominal.m analysis/xv15_c81*.m ci_artifacts/spinner_trim/code_snapshot/
          git rev-parse HEAD > ci_artifacts/spinner_trim/COMMIT.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinner-trim-${{ matrix.speed }}kt-${{ github.sha }}
          path: ci_artifacts/spinner_trim
          if-no-files-found: error
