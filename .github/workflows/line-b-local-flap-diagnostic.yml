name: Line B local flap failure localization
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/line-b-local-flap-diagnostic.yml','analysis/validation_whole_aircraft_trim/run_line_b_flap_local_diagnostic.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-probes:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_flap_local_diagnostic(fullfile(pwd,'ci_artifacts','local_flap'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-flap-diagnostic-${{ github.sha }}
          path: ci_artifacts/local_flap
