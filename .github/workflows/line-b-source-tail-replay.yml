name: Line B source-input conditional tail replay
on:
  push:
    branches: [implementation/line-b-external-validation-20260910]
    paths: ['.github/workflows/line-b-source-tail-replay.yml','analysis/validation_whole_aircraft_trim/run_line_b_source_tail_replay.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2021a
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            startup;addpath(fullfile(pwd,'analysis','stage2_aircraft'));
            addpath(fullfile(pwd,'analysis','validation_whole_aircraft_trim'));
            run_line_b_source_tail_replay(fullfile(pwd,'ci_artifacts','source_replay'));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-tail-replay-${{ github.sha }}
          path: ci_artifacts/source_replay
